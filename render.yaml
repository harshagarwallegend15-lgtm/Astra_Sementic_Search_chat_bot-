# Render blueprint for ASTRA INTEL.
#
# Render reads this on "New > Blueprint" and provisions the service, the disk
# and the health check. Without the disk the FAISS index is rebuilt on every
# cold start; with it, restarts keep the corpus.
#
# Validate with:  render blueprints validate render.yaml
# or against https://render.com/schema/render.yaml.json
#
# The service reads PORT, which Render injects, so nothing here hardcodes one.

services:
  - type: web
    name: astra-intel
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    # 1 CPU / 2 GB. The free tier is 0.1 CPU / 512 MB, which cannot hold torch
    # plus a loaded MiniLM model and a FAISS index: the container is OOM-killed
    # during startup, before it can serve anything.
    plan: 1c-2g
    healthCheckPath: /api/health
    # No healthCheckTimeout field exists. Render probes the path until the
    # container is listening; a cold start that extracts, chunks and embeds the
    # starter PDFs just takes longer to get there.
    autoDeployTrigger: commit
    # maxShutdownDelaySeconds was removed deliberately. Render rejects the whole
    # Blueprint for a service that has both a disk and that field, and it does
    # so after the editor has already accepted every other key. The disk wins:
    # without it the FAISS index and uploaded PDFs are lost on every deploy and
    # the corpus is re-embedded from scratch on each cold start. A briefing cut
    # short by a redeploy is a rerunnable inconvenience; a lost corpus is not.
    envVars:
      - key: LLM_PROVIDER
        value: groq
      - key: LLM_MODEL
        value: openai/gpt-oss-120b
      - key: LLM_API_KEY
        sync: false # set this in the dashboard; never commit a key
      - key: EMBEDDING_BACKEND
        # "semantic", not "auto": auto silently falls back to a lexical hashing
        # embedder when the model cannot load, which returns plausible-looking
        # but semantically wrong results. Failing loudly is the only safe
        # default in production.
        value: semantic
      - key: LOG_LEVEL
        value: INFO
    disk:
      name: astra-data
      # The FAISS index and uploaded PDFs live here, not in the image. Baking
      # them in would ship a stale corpus that overwrites the disk.
      mountPath: /app/data
      sizeGB: 1